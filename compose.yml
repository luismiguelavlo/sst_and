services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: campus-sst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_sst
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_sst_dev
    ports:
      - "5433:5432"
    volumes:
      - campus_sst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_sst"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  campus_sst_pgdata:
